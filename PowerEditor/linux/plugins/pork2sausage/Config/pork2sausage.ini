; Pork to Sausage on Linux: the default commands (the ones of Windows need Java and Windows paths).
; Each section is a command of the Plugins > Pork to Sausage menu. Edit this file in
; ~/.config/linuxpad++/plugins/config/pork2Sausage.ini (copied there at the first start).
;
; - Section parameters
; --------------------
;   progPath: [Mandatory] The full path of the program to launch
;   progCmd: [Mandatory] The whole command line, run by /bin/sh (pipes and redirections work)
;   workDir: [Mandatory] The path of working directory
;   progInput: [Optional] A file in which the selected text is written before the command runs
;   progOutput: [Optional] A file whose content replaces the selected text (else the standard output)
;   replaceSelection: [Optional] If its value is false, then the selected text will be untouched.
;
; - Variables
; -----------
;   $(SELECTION): the selected text, between single quotes in the command line
;   $(TIMESTAMP): a time stamp, for unique file names of progInput

[Base64 encode]
progPath=/usr/bin/base64
progCmd=printf %s $(SELECTION) | /usr/bin/base64 -w0
workDir=/tmp

[Base64 decode]
progPath=/usr/bin/base64
progCmd=printf %s $(SELECTION) | /usr/bin/base64 -d
workDir=/tmp

[Sort lines]
progPath=/usr/bin/sort
progCmd=printf '%s\n' $(SELECTION) | /usr/bin/sort
workDir=/tmp
